<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>圆的面积公式推导 · 化圆为方</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #e8f2fa;
      color: #1e3c3c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      max-width: 900px;
      width: 100%;
      background: #ffffff;
      border-radius: 32px;
      box-shadow: 0 12px 30px rgba(60, 100, 160, 0.15);
      padding: 24px 24px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 600;
      color: #1a4a7a;
      text-align: center;
      letter-spacing: 2px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 span {
      background: #dceaf8;
      padding: 4px 18px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 400;
      color: #2a5a8a;
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      background: #f0f7fd;
      border-radius: 28px;
      padding: 8px;
      box-shadow: inset 0 0 0 1px #c8ddf0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      width: 100%;
      height: auto;
      max-width: 640px;
      aspect-ratio: 4 / 3;
      display: block;
      border-radius: 20px;
      background: #f7fbff;
      touch-action: none;
    }

    .explain-box {
      background: #e4eef9;
      border-left: 6px solid #3a7abf;
      padding: 22px 24px;
      border-radius: 18px;
      font-size: 1.05rem;
      line-height: 1.9;
      color: #1a3a5c;
      min-height: 5rem;
      display: block;
      transition: background 0.2s;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
      word-break: break-word;
    }

    .explain-box strong { color: #1a4a7a; font-weight: 700; }

    .explain-box .formula {
      font-family: "Courier New", monospace;
      background: #fff3c4;
      color: #a06010;
      padding: 2px 10px;
      border-radius: 8px;
      font-weight: 700;
      display: inline-block;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px 8px;
      background: #eef5fc;
      border-radius: 30px;
      padding: 12px 18px;
      margin-top: 4px;
      border: 1px solid #c2d8ec;
    }

    .ctrl-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .ctrl-group label { font-size: 0.9rem; font-weight: 500; color: #2a5a8a; white-space: nowrap; }

    button {
      background: white;
      border: 2px solid #3a7abf;
      color: #1a4a7a;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 40px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.15s;
      white-space: nowrap;
    }

    button:hover { background: #dceaf8; border-color: #2a5a9a; transform: scale(1.02); }
    button.primary { background: #3a7abf; color: white; border-color: #3a7abf; }
    button.primary:hover { background: #2a5a9a; }
    button.step { background: #fff4e0; border-color: #e8a030; color: #a06010; }
    button.step:hover { background: #ffe8c0; border-color: #d09020; }

    input[type="range"] {
      width: 150px;
      height: 6px;
      -webkit-appearance: none;
      background: #b8d0e8;
      border-radius: 10px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #3a7abf;
      border: 2px solid white;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #3a7abf;
      border: 2px solid white;
      cursor: pointer;
    }

    .value-badge {
      background: white;
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #1a4a7a;
      min-width: 50px;
      text-align: center;
      border: 1px solid #b0cce8;
    }

    .stage-indicator { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }

    .stage-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #c2d8ec;
      transition: all 0.25s;
    }

    .stage-dot.active {
      background: #3a7abf;
      transform: scale(1.3);
      box-shadow: 0 0 0 3px rgba(58, 122, 191, 0.2);
    }

    .stage-dot.done { background: #6aabdf; }

    .stage-label { font-size: 0.8rem; color: #5a7a9a; margin-left: 4px; }

    .footer-note { font-size: 0.8rem; color: #6a8aaa; text-align: center; margin-top: 4px; }

    @media (max-width: 600px) {
      .container { padding: 16px; }
      h1 { font-size: 1.4rem; }
      .controls { flex-direction: column; align-items: stretch; }
      .ctrl-group { justify-content: space-between; }
      .explain-box { font-size: 0.95rem; padding: 18px 18px; line-height: 1.8; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>
      📐 圆的面积公式推导
      <span>化圆为方</span>
    </h1>

    <div class="canvas-wrapper">
      <canvas id="circleCanvas" width="800" height="600"></canvas>
    </div>

    <div class="explain-box" id="explainBox">
      点击 <strong>开始演示</strong>，观察圆如何一步步变成近似长方形 ✨
    </div>

    <div class="controls">
      <div class="ctrl-group">
        <label>等分份数</label>
        <input type="range" id="partsSlider" min="0" max="7" step="1" value="3">
        <span class="value-badge" id="partsValue">32</span>
      </div>

      <div class="ctrl-group">
        <button class="step" id="stepBtn">⏭ 分步演示</button>
        <button class="primary" id="startBtn">▶ 连续演示</button>
        <button id="resetBtn">↺ 重置</button>
      </div>
    </div>

    <div class="stage-indicator">
      <div class="stage-dot active" data-stage="0"></div>
      <div class="stage-dot" data-stage="1"></div>
      <div class="stage-dot" data-stage="2"></div>
      <div class="stage-dot" data-stage="3"></div>
      <span class="stage-label" id="stageLabel">阶段 1/4：认识圆</span>
    </div>

    <div class="footer-note">拖动滑块改变等分份数 · 份数越多，拼成的图形越接近长方形</div>
  </div>

  <script>
    (function() {
      const canvas = document.getElementById('circleCanvas');
      const ctx = canvas.getContext('2d');
      const explainBox = document.getElementById('explainBox');
      const partsSlider = document.getElementById('partsSlider');
      const partsValue = document.getElementById('partsValue');
      const startBtn = document.getElementById('startBtn');
      const resetBtn = document.getElementById('resetBtn');
      const stepBtn = document.getElementById('stepBtn');
      const stageDots = document.querySelectorAll('.stage-dot');
      const stageLabel = document.getElementById('stageLabel');

      const CANVAS_W = 800;
      const CANVAS_H = 600;
      canvas.width = CANVAS_W;
      canvas.height = CANVAS_H;

      const R = 120;
      const CIRCLE_CX = CANVAS_W / 2;
      const CIRCLE_CY = CANVAS_H / 2 + 10;
      const PARA_CY = CANVAS_H / 2 - 10;

      const STAGES = [
        { progress: 0,    name: '认识圆' },
        { progress: 0.55, name: '分成两排' },
        { progress: 1.0,  name: '交错咬合' },
        { progress: 1.0,  name: '标注公式' }
      ];
      let currentStage = 0;

      let partsCount = 32;
      let animationProgress = 0;
      let targetProgress = 0;
      let isPlaying = false;
      let animationFrame = null;
      let lastTimestamp = 0;
      const FIXED_SPEED = 0.8;
      let forceShowAnnotation = false;

      const BLUE = '#4A90D9';
      const RED = '#E85D5D';
      const EDGE = 'rgba(255,255,255,0.85)';
      const CIRCLE_FILL = '#D6E8F7';
      const CIRCLE_STROKE = '#4A90D9';

      function sliderIndexToParts(index) {
        const map = [4, 8, 16, 32, 64, 128, 256, 512];
        return map[Math.min(index, map.length - 1)];
      }

      function updatePartsDisplay() { partsValue.textContent = partsCount; }

      function updateStageIndicator() {
        stageDots.forEach((dot, i) => {
          dot.classList.remove('active', 'done');
          if (i < currentStage) dot.classList.add('done');
          if (i === currentStage) dot.classList.add('active');
        });
        stageLabel.textContent = `阶段 ${currentStage + 1}/4：${STAGES[currentStage].name}`;
      }

      function setExplainText(progress, stageOverride) {
        const stage = (stageOverride !== undefined) ? stageOverride : currentStage;
        let html = '';

        if (stage === 0) {
          html = `🔵 这是一个半径为 <strong>r</strong> 的圆，周长 <strong>C = 2πr</strong>。`;
        } else if (stage === 1) {
          html = `📋 把圆平均分成 <strong>${partsCount} 份</strong>小扇形，蓝色扇形尖口朝下排成一排，红色扇形尖口朝上排成一排。`;
        } else if (stage === 2) {
          html = `🧩 红色扇形整体向右滑半个扇形，与蓝色扇形上下交错咬合，拼成近似长方形。`;
        } else if (stage === 3) {
          html = `📏 拼成的近似长方形：长 ≈ πr，宽 ≈ r<br>
                  📐 面积 = 长 × 宽 = πr × r = πr²<br>
                  ✅ 所以圆的面积公式是 <span class="formula">S = πr²</span><br>
                  ✨ 分的份数越多，拼成的图形越接近长方形！`;
        }

        explainBox.innerHTML = html;
      }

      function easeInOutSine(t) { return -(Math.cos(Math.PI * t) - 1) / 2; }

      function drawCanvas() {
        ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
        const progress = animationProgress;
        const easeProgress = easeInOutSine(progress);

        drawSectorsAndParallelogram(easeProgress, forceShowAnnotation);
      }

      function drawSectorsAndParallelogram(easeT, showAnnotation) {
        const N = partsCount;
        const angleStep = (Math.PI * 2) / N;
        const halfN = N / 2;

        const halfAngle = angleStep / 2;
        const sinHalf = Math.sin(halfAngle);
        const cosHalf = Math.cos(halfAngle);
        const chordLen = 2 * R * sinHalf;

        const blueApexY = PARA_CY + 40;
        const redApexY = blueApexY - R * cosHalf;

        const blueX0 = CIRCLE_CX - (halfN - 1) * chordLen / 2;

        const rowT = Math.min(Math.max((easeT - 0.2) / 0.35, 0), 1);
        const interlockT = Math.min(Math.max((easeT - 0.55) / 0.45, 0), 1);

        const redOffsetX = R * sinHalf * interlockT;

        const showShapeT = Math.min(Math.max((easeT - 0.82) / 0.18, 0), 1);
        const annotationAlpha = showAnnotation ? 1 : showShapeT;

        // 圆形底（淡出）
        if (rowT < 0.95) {
          ctx.save();
          ctx.globalAlpha = 1 - rowT * 0.95;

          ctx.beginPath();
          ctx.arc(CIRCLE_CX, CIRCLE_CY, R, 0, Math.PI * 2);
          ctx.fillStyle = CIRCLE_FILL;
          ctx.fill();
          ctx.strokeStyle = CIRCLE_STROKE;
          ctx.lineWidth = 2;
          ctx.stroke();

          if (rowT < 0.5) {
            ctx.strokeStyle = 'rgba(255,255,255,0.9)';
            ctx.lineWidth = 1.5;
            for (let i = 0; i < N; i++) {
              const a = i * angleStep - Math.PI / 2;
              ctx.beginPath();
              ctx.moveTo(CIRCLE_CX, CIRCLE_CY);
              ctx.lineTo(CIRCLE_CX + R * Math.cos(a), CIRCLE_CY + R * Math.sin(a));
              ctx.stroke();
            }
          }

          ctx.font = 'bold 22px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif';
          ctx.fillStyle = '#C04040';
          ctx.textAlign = 'center';
          ctx.fillText('r', CIRCLE_CX + R * 0.5, CIRCLE_CY - R * 0.3);
          ctx.fillStyle = '#2A5A8A';
          ctx.fillText('C = 2πr', CIRCLE_CX, CIRCLE_CY - R - 20);
          ctx.restore();
        }

        const edgeWidth = N >= 128 ? 0.5 : 1.5;

        // 蓝排
        for (let k = 0; k < halfN; k++) {
          const i = 2 * k;
          const startApexX = CIRCLE_CX;
          const startApexY = CIRCLE_CY;
          const startMidAngle = i * angleStep - Math.PI / 2 + angleStep / 2;

          const targetApexX = blueX0 + k * chordLen;
          const targetApexY = blueApexY;
          const targetMidAngle = -Math.PI / 2;

          const apexX = startApexX + (targetApexX - startApexX) * rowT;
          const apexY = startApexY + (targetApexY - startApexY) * rowT;
          const midAngle = startMidAngle + (targetMidAngle - startMidAngle) * rowT;

          drawSector(apexX, apexY, midAngle, angleStep, BLUE, edgeWidth);
        }

        // 红排
        for (let k = 0; k < halfN; k++) {
          const i = 2 * k + 1;
          const startApexX = CIRCLE_CX;
          const startApexY = CIRCLE_CY;
          const startMidAngle = i * angleStep - Math.PI / 2 + angleStep / 2;

          const targetApexX = blueX0 + k * chordLen + redOffsetX;
          const targetApexY = redApexY;
          const targetMidAngle = Math.PI / 2;

          const apexX = startApexX + (targetApexX - startApexX) * rowT;
          const apexY = startApexY + (targetApexY - startApexY) * rowT;
          const midAngle = startMidAngle + (targetMidAngle - startMidAngle) * rowT;

          drawSector(apexX, apexY, midAngle, angleStep, RED, edgeWidth);
        }

        // 平行四边形轮廓和长/宽标注
        if (annotationAlpha > 0) {
          const redX0 = blueX0 + R * sinHalf;
          const pTL = { x: blueX0 - R * sinHalf, y: blueApexY - R * cosHalf };
          const pTR = { x: blueX0 + (halfN - 1) * chordLen + R * sinHalf, y: blueApexY - R * cosHalf };
          const pBR = { x: redX0 + (halfN - 1) * chordLen + R * sinHalf, y: redApexY + R * cosHalf };
          const pBL = { x: redX0 - R * sinHalf, y: redApexY + R * cosHalf };

          ctx.save();
          ctx.globalAlpha = annotationAlpha * 0.95;

          ctx.beginPath();
          ctx.setLineDash([8, 6]);
          ctx.strokeStyle = '#2A5A8A';
          ctx.lineWidth = 2.5;
          ctx.moveTo(pTL.x, pTL.y);
          ctx.lineTo(pTR.x, pTR.y);
          ctx.lineTo(pBR.x, pBR.y);
          ctx.lineTo(pBL.x, pBL.y);
          ctx.closePath();
          ctx.stroke();
          ctx.setLineDash([]);

          // ★ 长标注（原"底 ≈ πr"）
          ctx.font = 'bold 20px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif';
          ctx.fillStyle = '#C04040';
          ctx.textAlign = 'center';
          ctx.beginPath();
          ctx.setLineDash([6, 6]);
          ctx.strokeStyle = '#C04040';
          ctx.lineWidth = 1.8;
          ctx.moveTo(pBL.x, pBL.y + 28);
          ctx.lineTo(pBR.x, pBR.y + 28);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillText('长 ≈ πr', (pBL.x + pBR.x) / 2, pBL.y + 55);

          // ★ 宽标注（原"高 ≈ r"）
          ctx.fillStyle = '#3A70B0';
          ctx.textAlign = 'right';
          ctx.beginPath();
          ctx.setLineDash([6, 6]);
          ctx.strokeStyle = '#3A70B0';
          ctx.lineWidth = 1.8;
          const highLeftX = Math.min(pTL.x, pBL.x) - 30;
          ctx.moveTo(highLeftX, pTL.y);
          ctx.lineTo(highLeftX, pBL.y);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(highLeftX - 8, pTL.y);
          ctx.lineTo(highLeftX + 8, pTL.y);
          ctx.moveTo(highLeftX - 8, pBL.y);
          ctx.lineTo(highLeftX + 8, pBL.y);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillText('宽 ≈ r', highLeftX - 12, (pTL.y + pBL.y) / 2 + 6);

          ctx.restore();
        }

        // 平行四边形内部的 S = πr²（只在阶段4 显示）
        if (showAnnotation) {
          const redX0 = blueX0 + R * sinHalf;
          const pTL = { x: blueX0 - R * sinHalf, y: blueApexY - R * cosHalf };
          const pBR = { x: redX0 + (halfN - 1) * chordLen + R * sinHalf, y: redApexY + R * cosHalf };
          const pBL = { x: redX0 - R * sinHalf, y: redApexY + R * cosHalf };

          ctx.save();
          ctx.font = 'bold 32px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif';
          ctx.fillStyle = '#1a4a7a';
          ctx.shadowColor = 'rgba(60,100,160,0.25)';
          ctx.shadowBlur = 10;
          ctx.textAlign = 'center';
          ctx.fillText('S = πr²', (pTL.x + pBR.x) / 2, (pTL.y + pBL.y) / 2 + 10);
          ctx.restore();
        }
      }

      function drawSector(apexX, apexY, midAngle, spread, fillColor, edgeWidth) {
        const halfSpread = spread / 2;
        const a1 = midAngle - halfSpread;
        const a2 = midAngle + halfSpread;

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(apexX, apexY);
        ctx.arc(apexX, apexY, R, a1, a2, false);
        ctx.closePath();
        ctx.fillStyle = fillColor;
        ctx.fill();
        ctx.strokeStyle = EDGE;
        ctx.lineWidth = edgeWidth || 1.5;
        ctx.stroke();
        ctx.restore();
      }

      function animate(timestamp) {
        if (!lastTimestamp) lastTimestamp = timestamp;
        const delta = Math.min(timestamp - lastTimestamp, 60);
        lastTimestamp = timestamp;

        if (isPlaying && animationProgress < 1) {
          const baseStep = (delta / 1000) * 0.22 * FIXED_SPEED;
          const slowdown = 0.45 + 0.55 * Math.abs(Math.sin(animationProgress * Math.PI * 2));
          const step = baseStep * slowdown;
          animationProgress = Math.min(animationProgress + step, 1);

          let autoStage = 0;
          if (animationProgress < 0.2) {
            autoStage = 0;
          } else if (animationProgress < 0.55) {
            autoStage = 1;
          } else if (animationProgress < 0.85) {
            autoStage = 2;
          } else {
            autoStage = 3;
          }

          if (autoStage !== currentStage) {
            currentStage = autoStage;
            updateStageIndicator();
          }

          setExplainText(animationProgress, currentStage);
          drawCanvas();

          if (animationProgress >= 1) {
            isPlaying = false;
            currentStage = 3;
            forceShowAnnotation = true;
            updateStageIndicator();
            setExplainText(1, 3);
            drawCanvas();
          }
        }

        if (!isPlaying && Math.abs(animationProgress - targetProgress) > 0.004) {
          const diff = targetProgress - animationProgress;
          const step = Math.sign(diff) * Math.min(Math.abs(diff), (delta / 1000) * 0.3 * FIXED_SPEED);
          animationProgress += step;
          setExplainText(animationProgress);
          drawCanvas();
        }

        animationFrame = requestAnimationFrame(animate);
      }

      animationFrame = requestAnimationFrame(animate);

      function resetAll() {
        animationProgress = 0;
        targetProgress = 0;
        isPlaying = false;
        currentStage = 0;
        forceShowAnnotation = false;
        updateStageIndicator();
        setExplainText(0, 0);
        drawCanvas();
      }

      partsSlider.addEventListener('input', (e) => {
        partsCount = sliderIndexToParts(parseInt(e.target.value, 10));
        updatePartsDisplay();
        resetAll();
      });

      startBtn.addEventListener('click', () => {
        resetAll();
        targetProgress = 1;
        isPlaying = true;
        lastTimestamp = 0;
      });

      stepBtn.addEventListener('click', () => {
        isPlaying = false;

        if (currentStage < 3) {
          currentStage++;
        } else {
          resetAll();
          return;
        }

        updateStageIndicator();

        if (currentStage === 0) {
          targetProgress = 0;
          forceShowAnnotation = false;
        } else if (currentStage === 1) {
          targetProgress = 0.55;
          forceShowAnnotation = false;
        } else if (currentStage === 2) {
          targetProgress = 1.0;
          forceShowAnnotation = false;
        } else if (currentStage === 3) {
          targetProgress = 1.0;
          forceShowAnnotation = true;
        }

        setExplainText(targetProgress, currentStage);
        lastTimestamp = 0;
        drawCanvas();
      });

      resetBtn.addEventListener('click', () => { resetAll(); });

      function init() {
        partsCount = sliderIndexToParts(parseInt(partsSlider.value, 10));
        updatePartsDisplay();
        updateStageIndicator();
        setExplainText(0, 0);
        drawCanvas();
      }

      init();
      window.addEventListener('resize', () => drawCanvas());
    })();
  </script>
</body>
</html>
